<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstikAdNU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="brand">
      <h1>Create Account</h1>
      <p>Register as a faculty member</p>
    </div>

    <nav class="tabs">
      <a href="studentRegister.html">Student</a>
      <a href="facultyRegister.html" class="active">Faculty</a>
    </nav>

    <form action="#" method="post">
      <input type="hidden" name="role" value="faculty">
      <div class="row">
        <label>First Name
          <input type="text" name="first_name" autocomplete="given-name" required>
        </label>
        <label>Last Name
          <input type="text" name="last_name" autocomplete="family-name" required>
        </label>
      </div>
      <label>Employee ID
        <input type="text" name="employee_id" placeholder="e.g. F-2023-001" required>
      </label>
      <label>Department
        <input type="text" name="department" placeholder="e.g. College of Computer Studies" required>
      </label>
      <label>Email
        <input type="email" name="email" placeholder="you@gbox.adnu.edu.ph" autocomplete="email" required>
      </label>
      <label>Password
        <input type="password" name="password" minlength="8" autocomplete="new-password" required>
      </label>
      <label>Confirm Password
        <input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required>
      </label>

      <button type="submit">Register</button>
    </form>

    <p class="footer">Already have an account? <a href="login.html">Log in</a></p>
  </main>
</body>
</html>
