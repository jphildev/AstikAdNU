<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstikAdNU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="brand">
      <h1>AstikAdNU</h1>
      <p>Sign in to your account</p>
    </div>

    <form action="#" method="post">
      <label>Email
        <input type="email" name="email" placeholder="you@gbox.adnu.edu.ph" autocomplete="email" required>
      </label>
      <label>Password
        <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
      </label>

      <div class="options">
        <label><input type="checkbox" name="remember"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">Log In</button>
    </form>

    <p class="footer">Don't have an account? <a href="studentRegister.html">Register</a></p>
  </main>
</body>
</html>
